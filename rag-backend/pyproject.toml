[tool.poetry]
name = "ai-vision-rag-backend"
version = "1.0.0"
description = "Multi-tenant RAG knowledge base backend for AI Vision App"
authors = ["YellowElonMusk"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
python-multipart = "^0.0.6"
pymilvus = "^2.3.5"
sentence-transformers = "^2.3.1"
transformers = "^4.37.0"
torch = "^2.1.2"
pypdf = "^4.0.1"
python-docx = "^1.1.0"
python-magic = "^0.4.27"
markdown = "^3.5.2"
openai = "^1.10.0"
anthropic = "^0.18.1"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-dotenv = "^1.0.0"
cryptography = "^42.0.1"
sqlalchemy = "^2.0.25"
asyncpg = "^0.29.0"
alembic = "^1.13.1"
pydantic = "^2.5.3"
pydantic-settings = "^2.1.0"
aiofiles = "^23.2.1"
httpx = "^0.26.0"
redis = "^5.0.1"
structlog = "^24.1.0"
prometheus-client = "^0.19.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.4"
pytest-asyncio = "^0.23.3"
pytest-cov = "^4.1.0"
httpx = "^0.26.0"
black = "^24.1.0"
isort = "^5.13.2"
mypy = "^1.8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100
