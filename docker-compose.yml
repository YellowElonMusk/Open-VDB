services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vectordb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-vectordb_oem}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vectordb}"]
      interval: 5s
      timeout: 3s
      retries: 5
    # Not exposed to host by default — only the API container talks to it.
    # Uncomment below if you need direct DB access for debugging:
    # ports:
    #   - "5432:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      VDB_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vectordb}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vectordb_oem}
      VDB_DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-vectordb}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vectordb_oem}
      VDB_REDIS_URL: redis://redis:6379/0
      VDB_OPENAI_API_KEY: ${VDB_OPENAI_API_KEY:?Set VDB_OPENAI_API_KEY in .env}
      VDB_JWT_SECRET: ${VDB_JWT_SECRET:?Set VDB_JWT_SECRET in .env}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  pgdata:
  redisdata:
