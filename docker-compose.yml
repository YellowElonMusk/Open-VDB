services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vectordb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openvdb-local}
      POSTGRES_DB: ${POSTGRES_DB:-openvdb}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vectordb}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    ports:
      - "${VDB_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
    environment:
      VDB_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vectordb}:${POSTGRES_PASSWORD:-openvdb-local}@db:5432/${POSTGRES_DB:-openvdb}
      VDB_DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-vectordb}:${POSTGRES_PASSWORD:-openvdb-local}@db:5432/${POSTGRES_DB:-openvdb}
      VDB_LOCAL_MODE: ${VDB_LOCAL_MODE:-true}
      VDB_EMBEDDING_PROVIDER: ${VDB_EMBEDDING_PROVIDER:-local}
      VDB_OPENAI_API_KEY: ${VDB_OPENAI_API_KEY:-}
      VDB_EMBEDDING_MODEL: ${VDB_EMBEDDING_MODEL:-text-embedding-3-small}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
